services:
  nova-telegram:
    build:
      context: /var/www/NOVA
      dockerfile: docker/telegram/Dockerfile
    container_name: nova-telegram
    working_dir: /app
    restart: unless-stopped
    env_file: /var/www/NOVA/.env
    environment:
      APP_ENV: local
    volumes:
      - /var/www/NOVA:/app
    command: ["php", "telegram/bin/service.php"]
    networks:
      - backend
      - egress

networks:
  backend:
    name: nova_backend
    external: true
  egress:
    name: nova_egress
    external: true
