services:
  nova-monitor:
    build:
      context: /var/www/NOVA
      dockerfile: docker/monitor/Dockerfile
    container_name: nova-monitor
    working_dir: /app
    restart: unless-stopped
    env_file: /var/www/NOVA/.env
    environment:
      APP_ENV: production
    volumes:
      - /var/www/NOVA:/app
    command: ["php", "artisan", "nova:monitor-servers", "--daemon", "--sleep=10"]
    healthcheck:
      test: ["CMD", "php", "artisan", "nova:monitor-servers", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - egress

networks:
  backend:
    name: nova_backend
    external: true
  egress:
    name: nova_egress
    external: true
