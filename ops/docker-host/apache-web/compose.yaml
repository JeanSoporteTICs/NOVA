services:
  apache-web:
    build:
      context: /opt/docker/apache-web
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
        PUID: ${PUID:-1001}
        PGID: ${PGID:-1002}
    image: nova/apache-web:${PHP_VERSION:-8.2}
    container_name: apache-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      TZ: ${TZ:-America/Santiago}
    volumes:
      - /var/www:/var/www/html:z
      - /opt/docker/apache-web/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf:ro,Z
      - /opt/docker/apache-web/apache/ports.conf:/etc/apache2/ports.conf:ro,Z
      - /opt/docker/apache-web/apache/vhosts:/etc/apache2/vhosts.d:ro,z
      - /opt/docker/apache-web/php/zz-nova.ini:/usr/local/etc/php/conf.d/zz-nova.ini:ro,Z
      - apache_logs:/var/log/apache2
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web
      - backend

networks:
  web:
    name: nova_web
  backend:
    name: nova_backend
    external: true

volumes:
  apache_logs:
    name: nova_apache_logs
