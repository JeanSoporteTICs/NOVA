ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html

    # El checkout real conserva el nombre NOVA. Aceptar tambien la variante
    # minuscula y redirigirla a una unica URL canonica evita duplicar sesiones,
    # cookies o reglas de Laravel bajo dos prefijos distintos.
    RedirectMatch 301 ^/nova$ /NOVA/
    RedirectMatch 301 ^/nova/(.*)$ /NOVA/$1

    # Compatibilidad con enlaces legacy que apuntan al directorio public sin
    # indicar el front controller. En este despliegue Apache sirve /var/www/html,
    # por lo que NOVA entra explicitamente por index.php.
    RedirectMatch 301 ^/NOVA/public/?$ /NOVA/public/index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "(?i)^\.env(\..*)?$|^\.git.*$|^composer\.(json|lock|phar)$|^package(-lock)?\.json$|^phpunit\.xml$|\.(sql|bak|backup|log|key|pem|p12|pfx|crt|cer|tmp|temp|orig|swp|sh)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/(vendor|node_modules|storage|bootstrap/cache|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    ProxyPreserveHost On

    # ONLYOFFICE necesita conservar el upgrade WebSocket para el canal de
    # edición. Sin esta regla Apache lo reenvía como HTTP normal y Document
    # Server responde 400, aunque la interfaz y la descarga inicial den 200.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/onlyoffice/?(.*) ws://OnlyOffice/$1 [P,L]

    ProxyPass        /onlyoffice/ http://OnlyOffice/ retry=0 timeout=300
    ProxyPassReverse /onlyoffice/ http://OnlyOffice/

    <Location /onlyoffice/>
        SetEnvIf Host "^(.*)$" THE_HOST=$1
        RequestHeader setifempty X-Forwarded-Proto "http"
        RequestHeader setifempty X-Forwarded-Host "%{THE_HOST}e"
        RequestHeader edit X-Forwarded-Host "(.*)" "$1/onlyoffice"
        ProxyAddHeaders Off
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/default-error.log
    CustomLog ${APACHE_LOG_DIR}/default-access.log combined
</VirtualHost>
