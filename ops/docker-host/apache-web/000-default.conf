ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<VirtualHost *:80>
    ServerName _default_
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "(?i)^\.env(\..*)?$|^\.git.*$|^composer\.(json|lock|phar)$|^package(-lock)?\.json$|^phpunit\.xml$|\.(sql|bak|backup|log|key|pem|p12|pfx|crt|cer|tmp|temp|orig|swp|sh)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/(vendor|node_modules|storage|bootstrap/cache|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>

    ProxyPreserveHost On
    ProxyPass        /onlyoffice/ http://OnlyOffice/ retry=0 timeout=300
    ProxyPassReverse /onlyoffice/ http://OnlyOffice/

    <Location /onlyoffice/>
        RequestHeader set X-Forwarded-Proto "http"
        RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
        RequestHeader set X-Forwarded-Prefix "/onlyoffice"
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/default-error.log
    CustomLog ${APACHE_LOG_DIR}/default-access.log combined
</VirtualHost>
