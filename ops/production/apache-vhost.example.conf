# Example only. Replace the hostname/path and validate with the target Apache.
<VirtualHost *:443>
    ServerName nova.example.invalid
    DocumentRoot "/srv/nova/current/public"

    <Directory "/srv/nova/current">
        Require all denied
        AllowOverride None
    </Directory>

    <Directory "/srv/nova/current/public">
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "(?i)^(?:\.env|\.git|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml)$|\.(?:sql|bak|backup|log|key|pem|p12|pfx|crt|cer|tmp|temp|orig|swp)$">
        Require all denied
    </FilesMatch>

    ErrorLog  "/var/log/apache2/nova-error.log"
    CustomLog "/var/log/apache2/nova-access.log" combined

    # SSLEngine/Certificate directives belong to the environment configuration.
</VirtualHost>

