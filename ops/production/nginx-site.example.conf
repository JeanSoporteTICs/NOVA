# Example only. Replace the hostname/path and PHP-FPM socket for the target host.
server {
    listen 443 ssl http2;
    server_name nova.example.invalid;
    root /srv/nova/current/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(?:sql|bak|backup|log|key|pem|p12|pfx|crt|cer|tmp|temp|orig|swp)$ {
        deny all;
        return 404;
    }

    # TLS certificate directives belong to the environment configuration.
}

